name: Wallet Monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: hl-wallet-monitor
      cancel-in-progress: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run monitor
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
        run: python -u scripts/monitor.py

      - name: Commit and push state
        run: |
          git config user.name "wallet-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/
          git diff --quiet --cached || git commit -m "Monitor update [skip ci]"
          git pull --rebase origin main
          git push origin main
